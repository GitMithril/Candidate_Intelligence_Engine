version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: salik_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:alpine
    container_name: salik_redis
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: salik_api
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
      - redis
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/candidate_intelligence
      REDIS_URL: redis://redis:6379

volumes:
  mongo_data:
